# OOH Dashboard — deployment into AKS iot-services alongside the IoT Hub (F018/F024).
# Pipeline, secrets and ingress are Spencer-owned (SR-2); this manifest declares the
# app's own contract: resource limits, probes, config surface.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ooh-dashboard
  namespace: iot-services
  labels:
    app: ooh-dashboard
spec:
  # NOTE: replicas MUST stay at 1 until session affinity (or a shared session store)
  # is agreed — express-session state is in-process. Override reverts are already
  # multi-replica-safe (lease claims), sessions are not yet.
  replicas: 1
  selector:
    matchLabels:
      app: ooh-dashboard
  template:
    metadata:
      labels:
        app: ooh-dashboard
        azure.workload.identity/use: "true"
    spec:
      # F004/SD-586: federated to the prod workload identity id-ooh-dashboard-prod (keyless Cosmos).
      serviceAccountName: sa-ooh-dashboard
      containers:
        - name: ooh-dashboard
          # F004/SD-586: real registry + immutable git short-sha (never :latest) so rollback is
          # deterministic (runbook Step 3 / Rollback). CI substitutes <sha> at deploy time.
          image: apitechhub.azurecr.io/ooh-dashboard:<sha>
          ports:
            - containerPort: 3001
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 30
          env:
            - name: NODE_ENV
              value: "production"
            - name: AUTH_MODE
              value: "oidc"
            - name: DATA_MODE
              value: "live"
            - name: PORT
              value: "3001"
            # --- CANARY SAFETY LEVERS (F005/F009) — held here in git so they are auditable ---
            # WRITES_DISABLED locks every device-write path at deploy time (control dispatch AND
            # the override revert worker) regardless of the runtime kill-switch. SMS_PROVIDER=log
            # exercises the P1 path end-to-end without sending.
            #
            # DEVICE WRITES ARE NOW ENABLED (go/no-go #3 taken by James, 2026-09-24, OOHDASH-19).
            # Blockers B0-B3 were all cleared before the flip: B0 site identity at confirm is
            # satisfied (public/js/control.js), B1 TB read proven from the pod, B2 was a false
            # alarm (see the bridge-health note below), and B3 the SR-3 write credential was
            # proven live against ThingsBoard with a throwaway non-*Desired SHARED_SCOPE probe.
            # Stream A (refrigeration switch-deny) shipped in v1.3.0 and its boot self-test
            # (services/refrig-guard.js) passes on the running image, so cellar/fridge assets stay
            # monitor-only. SMS_PROVIDER stays "log" until go/no-go #4 (Q-F) — that lever is
            # unchanged by this commit.
            #
            # DRIFT NOTE: the live flip was applied with `kubectl -n iot-services set env
            # deployment/ooh-dashboard WRITES_DISABLED=false` because no CI applies this manifest.
            # This commit reconciles the file with the cluster so a future `kubectl apply` does not
            # silently RE-LOCK device control. Rollback is the same set env command with "=true".
            #
            # FAIL-CLOSED contract (OOHDASH-12): this VALUE is load-bearing. Writes are enabled
            # ONLY when WRITES_DISABLED is exactly "false" (as below). Any other value, an unset
            # var, or REMOVING this line entirely all resolve to writes DISABLED. Absence never
            # enables — so deleting this line is now a REGRESSION that silently kills live control,
            # not a tidy-up. Change the value; never drop the key.
            - name: WRITES_DISABLED
              value: "false"
            - name: SMS_PROVIDER
              value: "log"
            # APP_ORIGIN, BRIDGE_BASE_URL, OIDC_*, TB_*, ZENDESK_*, COSMOS_*, SESSION_SECRET,
            # ESCALATION_* and IOT_DASH_BASE_URL come from the Spencer-managed K8s Secret
            # (ooh-dashboard-secrets). IOT_DASH_BASE_URL MUST be the live dashboard host
            # (https://zendesk-uat.airedale-api.co.uk) so the P1 deep-link resolves (F004).
          envFrom:
            - secretRef:
                name: ooh-dashboard-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: ooh-dashboard
  namespace: iot-services
spec:
  selector:
    app: ooh-dashboard
  ports:
    - port: 80
      targetPort: 3001
