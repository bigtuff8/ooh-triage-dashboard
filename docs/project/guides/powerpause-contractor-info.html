<h1>Lighthouse PowerPause: Smart Appliance Control (Contractor Version)</h1>
<p class="note">This is the full Lighthouse PowerPause contractor guide, unchanged (9 pages). It shows the PowerPause panels, the Lighthouse label, the interlock start button and the manual override buttons.</p>
<figure class="pg"><img src="powerpause/page-1.jpg" width="1075" height="1521" alt="Page 1 of the PowerPause guide" loading="lazy"><details><summary>Page 1 text</summary><pre>Lighthouse PowerPause – Smart Appliance Control – Contractor 
Version 
PowerPause is part of the Lighthouse IoT roll-out. It makes sure kitchen appliances aren’t 
switched on too early or left running too late, saving energy and reducing costs. 
 
How It Works 
• 
Appliances are switched on/off automatically at agreed times. 
• 
Times are set in line with the pub’s operating hours. 
• 
Changes to schedules must be authorised by the Area Manager. 
• 
Ad-hoc exceptions (e.g. football matches, TV events, festive hours) should be raised 
with the Pub Support Team, who will coordinate with the Area Manager. 
 
Safety Interlock Appliances (Fryers &amp; Gantries) 
• 
Controlled via the interlock panel in the kitchen. 
• 
Green light ON → Appliance available to use. 
• 
Press the green button → You’ll hear the contactor click and the appliance powers up. 
 
 
 
All Devices connected to Power Pause 
• 
Controlled through Power Pause panel (pictured below) 
• 
Appliances have agreed schedules with Greene King (attached underneath)  
• 
2 different devices (Tongou &amp; Owon) 
• 
Both devices have an override switch (for contractor use only)</pre></details></figure>
