<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OOH Triage Flows — Mockup v2</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f1f5f9;color:#1e293b}
:root{--pri:#3b82f6;--pri-bg:rgba(59,130,246,.06);--ok:#22c55e;--ok-bg:rgba(34,197,94,.06);--warn:#f59e0b;--warn-bg:rgba(245,158,11,.06);--err:#ef4444;--err-bg:rgba(239,68,68,.06);--txt:#1e293b;--txt2:#64748b;--surf:#fff;--bdr:#e2e8f0;--bg:#f8fafc;--r:10px;--rs:6px}
.app{display:flex;height:100vh}

/* Sidebar */
.sb{width:260px;background:var(--surf);border-right:1px solid var(--bdr);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sb-hdr{padding:20px 16px 12px;border-bottom:1px solid var(--bdr)}
.sb-hdr h2{font-size:16px;display:flex;align-items:center;gap:8px}
.sb-hdr p{font-size:11px;color:var(--txt2);margin-top:4px}
.ns{padding:12px 8px 4px}
.nl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--txt2);padding:0 8px 6px}
.ni{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--rs);cursor:pointer;font-size:13px;font-weight:500;color:var(--txt);transition:all .12s}
.ni:hover{background:var(--bg)}.ni.act{background:var(--pri-bg);color:var(--pri)}
.ni .material-icons-outlined{font-size:18px}
.nb{margin-left:auto;font-size:10px;padding:2px 7px;border-radius:10px;background:var(--pri);color:#fff;font-weight:600}

/* Main */
.mn{flex:1;display:flex;flex-direction:column;overflow:hidden}
.tb{padding:14px 24px;background:var(--surf);border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between}
.tb h1{font-size:18px}.tb-r{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--txt2)}
.ct{flex:1;overflow-y:auto;padding:20px 24px}

/* Forms */
.form-section{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:20px;margin-bottom:20px}
.form-section h3{font-size:15px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid.cols3{grid-template-columns:1fr 1fr 1fr}
.fg{display:flex;flex-direction:column;gap:4px}
.fg.full{grid-column:1/-1}
.fg label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--txt2)}
.fg label .req{color:var(--err)}
.fg input,.fg select,.fg textarea{padding:9px 11px;border:1px solid var(--bdr);border-radius:var(--rs);font-size:13px;font-family:inherit;background:var(--bg)}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--pri)}
.fg textarea{resize:vertical;min-height:60px}
.fg .help{font-size:11px;color:var(--txt2);margin-top:2px}

/* Entry Cards */
.entry-section{margin-bottom:24px}
.entry-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-bottom:12px}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.ecard{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 16px;background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);cursor:pointer;text-align:center;transition:all .15s;position:relative}
.ecard:hover{border-color:var(--pri);box-shadow:0 2px 8px rgba(0,0,0,.06);transform:translateY(-1px)}
.ecard.dis{opacity:.4;cursor:default;pointer-events:none}
.ecard .material-icons-outlined{font-size:28px;color:var(--pri)}
.ecard span:last-of-type{font-size:13px;font-weight:500}

/* Search box */
.search-box{position:relative;margin-bottom:20px}
.search-box input{width:100%;padding:12px 12px 12px 40px;border:1px solid var(--bdr);border-radius:var(--r);font-size:14px;font-family:inherit;background:var(--surf)}
.search-box input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.search-box .material-icons-outlined{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--txt2);font-size:20px}
.search-suggestions{position:absolute;top:100%;left:0;right:0;background:var(--surf);border:1px solid var(--bdr);border-radius:var(--rs);box-shadow:0 8px 24px rgba(0,0,0,.1);margin-top:4px;z-index:10;display:none;max-height:240px;overflow-y:auto}
.search-suggestions.show{display:block}
.ss-item{padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:13px;border-bottom:1px solid rgba(0,0,0,.04)}
.ss-item:hover{background:var(--pri-bg)}
.ss-item .material-icons-outlined{font-size:18px;color:var(--pri)}

/* Triage layout */
.tl{display:flex;gap:16px;height:calc(100vh - 160px)}
.tc{flex:1;display:flex;flex-direction:column;min-width:0}
.ts{width:340px;flex-shrink:0;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.th{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);margin-bottom:8px}
.tfn{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px}

/* Chat */
.ca{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px}
.msg{padding:12px 14px;border-radius:var(--r);border-left:3px solid var(--pri);background:var(--surf);font-size:13px;line-height:1.6}
.msg-bot{border-left-color:var(--pri)}.msg-agent{border-left-color:var(--ok);background:var(--ok-bg)}
.msg-sys{border-left-color:var(--txt2);background:var(--bg);font-size:12px}
.msg-err{border-left-color:var(--err);background:var(--err-bg)}
.msg-esc{border-left-color:var(--warn);background:var(--warn-bg)}
.msg-res{border-left-color:var(--ok);background:var(--ok-bg)}
.msg-script{border-left-color:#8b5cf6;background:rgba(139,92,246,.06)}
.mh{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:12px;color:var(--txt2)}
.mh .material-icons-outlined{font-size:16px}
.mt{color:var(--txt)}.mt strong{font-weight:600}

/* Actions */
.acts{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0}
.ab{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;background:var(--surf);border:1px solid var(--pri);border-radius:var(--rs);color:var(--pri);font-size:13px;font-weight:500;cursor:pointer;transition:all .12s;font-family:inherit}
.ab:hover{background:var(--pri);color:#fff}
.ab.err{border-color:var(--err);color:var(--err)}.ab.err:hover{background:var(--err);color:#fff}
.ab.ok{border-color:var(--ok);color:var(--ok)}.ab.ok:hover{background:var(--ok);color:#fff}
.ab.sec{border-color:var(--bdr);color:var(--txt2)}.ab.sec:hover{background:var(--bg);color:var(--txt)}
.ab .material-icons-outlined{font-size:16px}

/* Data cards */
.dc{padding:14px;background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);font-size:13px}
.dc h4{margin:0 0 10px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.dt{width:100%;border-collapse:collapse}
.dt th{text-align:left;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;color:var(--txt2);padding:6px 8px;border-bottom:1px solid var(--bdr)}
.dt td{padding:8px;border-bottom:1px solid rgba(0,0,0,.04);font-size:12px}
.dt tr:last-child td{border-bottom:none}.dt tr.hl{background:var(--pri-bg)}
.sd{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.sd.g{background:var(--ok)}.sd.r{background:var(--err)}.sd.a{background:var(--warn)}

/* Context / pocket cards */
.cc{padding:14px;background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r)}
.cc h4{margin:0 0 8px;font-size:13px;font-weight:600}
.cr{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--bdr);font-size:12px}
.cr:last-child{border-bottom:none}.cr span:first-child{color:var(--txt2)}
.pc{padding:12px;background:var(--warn-bg);border:1px solid rgba(245,158,11,.2);border-radius:var(--r)}
.pc h4{margin:0 0 6px;font-size:12px;font-weight:600;color:#92400e;display:flex;align-items:center;gap:4px}

/* Severity */
.sev{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:600}
.sev.crit{background:var(--err-bg);color:var(--err)}.sev.high{background:var(--warn-bg);color:#92400e}
.sev.med{background:var(--pri-bg);color:var(--pri)}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;background:#1e293b;color:#fff;padding:12px 20px;border-radius:var(--rs);font-size:13px;display:flex;align-items:center;gap:8px;transform:translateY(80px);opacity:0;transition:all .3s;z-index:999}
.toast.show{transform:translateY(0);opacity:1}.toast .material-icons-outlined{font-size:18px}

/* Service chips */
.sgrid{display:flex;flex-wrap:wrap;gap:8px}
.sc{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--surf);border:1px solid var(--bdr);border-radius:var(--rs);font-size:12px}
.sc .material-icons-outlined{font-size:14px;color:var(--txt2)}

/* Step indicator */
.steps{display:flex;align-items:center;gap:0;margin-bottom:20px}
.step{display:flex;align-items:center;gap:6px;padding:8px 16px;font-size:12px;font-weight:500;color:var(--txt2);position:relative}
.step.active{color:var(--pri);font-weight:600}
.step.done{color:var(--ok)}
.step::after{content:'›';margin-left:12px;font-size:16px;color:var(--bdr)}
.step:last-child::after{display:none}
.step .material-icons-outlined{font-size:16px}

::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
@media(max-width:900px){.sb{display:none}.tl{flex-direction:column;height:auto}.ts{width:100%}.form-grid{grid-template-columns:1fr}.egrid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
<aside class="sb">
    <div class="sb-hdr">
        <h2><span class="material-icons-outlined" style="color:var(--pri)">support_agent</span> OOH Triage</h2>
        <p>Out-of-hours call handler</p>
    </div>
    <div class="ns">
        <div class="nl">Triage</div>
        <div class="ni act" onclick="goHome()" id="navHome"><span class="material-icons-outlined">home</span> New Call</div>
    </div>
    <div class="ns">
        <div class="nl">Monitor</div>
        <div class="ni" onclick="showPocketChanges()"><span class="material-icons-outlined">timer</span> Active Overrides <span class="nb">1</span></div>
    </div>
    <div style="margin-top:auto;padding:12px 16px;font-size:11px;color:var(--txt2);border-top:1px solid var(--bdr)">
        OOH Mockup v2<br>24 Mar 2026
    </div>
</aside>
<div class="mn">
    <div class="tb">
        <h1 id="pageTitle">New Call</h1>
        <div class="tb-r"><span class="material-icons-outlined" style="font-size:16px">schedule</span><span id="clock"></span></div>
    </div>
    <div class="ct" id="vc"></div>
</div>
</div>
<div class="toast" id="toast"><span class="material-icons-outlined" id="tI">check_circle</span><span id="tM"></span></div>

<script>
// ============================================================================
// DATA
// ============================================================================
const SITES=[
{v:'gk_fi_10234',name:'Greene King::Farmhouse Inns::10234 - The Red Lion, Leeds',no:'10234',hours:'11:00-23:00',client:'Greene King',brand:'Farmhouse Inns'},
{v:'gk_fi_10567',name:'Greene King::Farmhouse Inns::10567 - The White Hart, York',no:'10567',hours:'11:00-23:30',client:'Greene King',brand:'Farmhouse Inns'},
{v:'gk_fg_11002',name:'Greene King::Flaming Grill::11002 - The George & Dragon, Bradford',no:'11002',hours:'11:00-23:00',client:'Greene King',brand:'Flaming Grill'},
{v:'gk_cb_12100',name:'Greene King::Chef & Brewer::12100 - The Stag, Harrogate',no:'12100',hours:'10:00-23:30',client:'Greene King',brand:'Chef & Brewer'},
{v:'mcd_20001',name:'McDonalds::20001 - Leeds City Centre',no:'20001',hours:'06:00-01:00',client:'McDonalds',brand:''},
];

const ZONES=[
{zone:'Bar',temp:14.2,setpoint:18,mode:'Auto',id:'sal-001',status:'heating',online:true},
{zone:'Kitchen',temp:19.8,setpoint:20,mode:'Auto',id:'sal-002',status:'idle',online:true},
{zone:'Dining',temp:13.5,setpoint:18,mode:'Auto',id:'sal-003',status:'heating',online:true},
{zone:'Accommodation',temp:16.1,setpoint:18,mode:'Auto',id:'sal-004',status:'heating',online:true},
{zone:'Cellar',temp:11.2,setpoint:12,mode:'Auto',id:'sal-005',status:'idle',online:true},
];

const SCHEDULES=[
{name:'Morning On',time:'05:30',action:'ON',enabled:true,days:'Mon-Fri'},
{name:'Evening Off',time:'22:00',action:'OFF',enabled:true,days:'Mon-Fri'},
{name:'Weekend On',time:'07:00',action:'ON',enabled:true,days:'Sat-Sun'},
{name:'Weekend Off',time:'20:00',action:'OFF',enabled:true,days:'Sat-Sun'},
];

const EQUIPMENT_TYPES=[
{label:'Heating & Hot Water',icon:'thermostat',problems:['Too cold / not warm enough','No hot water','Water not hot enough','Heating not turning on','Heating not turning off']},
{label:'Kitchen Equipment',icon:'restaurant',problems:['Fryers not turning on','Equipment keeps turning off','Oven not working','Equipment making unusual noise']},
{label:'Refrigeration',icon:'kitchen',problems:['Fridge/freezer alarm going off','Fridge/freezer too warm','Fridge/freezer not turning on','Beer cellar too warm']},
{label:'Air Conditioning',icon:'ac_unit',problems:['AC blowing cold when should be warm','AC blowing warm when should be cool','AC not turning on','AC making noise']},
{label:'Connectivity / Controls',icon:'router',problems:['Equipment not responding to app','Display showing error','Thermostat blank/unresponsive']},
];

const PROBLEM_TYPES=[
{label:"It's too cold in here",icon:'ac_unit',flow:'tooCold',keywords:['cold','freezing','heating','warm','temperature','chilly']},
{label:"It's too hot in here",icon:'whatshot',flow:'tooHot',keywords:['hot','warm','overheating','boiling','sweltering']},
{label:'No hot water',icon:'water_drop',flow:'noHotWater',keywords:['hot water','water','shower','tap','dhw','boiler']},
{label:'Kitchen equipment not working',icon:'restaurant',flow:'kitchenEquip',keywords:['fryer','oven','kitchen','grill','equipment','cook','food']},
{label:'Fridge or freezer alarm',icon:'kitchen',flow:'fridgeAlarm',keywords:['fridge','freezer','alarm','cold room','walk-in','temperature','beer','cellar']},
{label:'Equipment won\'t turn on',icon:'power_off',flow:'wontTurnOn',keywords:['turn on','power','switch','won\'t start','not working','dead']},
{label:'Equipment keeps turning off',icon:'power_settings_new',flow:'keepsTurningOff',keywords:['turning off','keeps going off','switching off','cuts out','trips']},
{label:'Something else',icon:'contact_support',flow:'somethingElse',keywords:[]},
];

// ============================================================================
// STATE
// ============================================================================
let view='landing', flow=null, msgs=[], site=null, caller={}, summary=[], flowStart=null;

// ============================================================================
// RENDER
// ============================================================================
function render(){
    const c=document.getElementById('vc');
    if(view==='landing') renderLanding(c);
    else if(view==='intake') renderIntake(c);
    else if(view==='selectProblem') renderSelectProblem(c);
    else if(view==='triage') renderTriage(c);
    else if(view==='pocket') renderPocket(c);
    else if(view==='wrapUp') renderWrapUp(c);
    document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+' — Out of Hours';
}

function goHome(){view='landing';flow=null;msgs=[];summary=[];caller={};site=null;render()}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function sn(){return site?site.name.split('::').pop():'Unknown Site'}
function now(){return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function revTime(){const d=new Date(Date.now()+2*3600000);return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function toast(m,i){const t=document.getElementById('toast');document.getElementById('tM').textContent=m;document.getElementById('tI').textContent=i||'check_circle';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}

// ============================================================================
// STEP 1: LANDING — site selection + free text search
// ============================================================================
function renderLanding(c){
    document.getElementById('pageTitle').textContent='New Call';
    c.innerHTML=`
    <div class="steps">
        <div class="step active"><span class="material-icons-outlined">call</span> New Call</div>
        <div class="step">Caller Details</div>
        <div class="step">Identify Problem</div>
        <div class="step">Triage</div>
        <div class="step">Wrap Up</div>
    </div>
    <div class="form-section">
        <h3><span class="material-icons-outlined">location_on</span> Select Site</h3>
        <div class="form-grid">
            <div class="fg full">
                <label>Site <span class="req">*</span></label>
                <select id="siteSelect" onchange="pickSite(this.value)">
                    <option value="">-- Select site --</option>
                    ${SITES.map(s=>`<option value="${s.v}" ${site?.v===s.v?'selected':''}>${s.name.split('::').pop()} — ${s.client}</option>`).join('')}
                </select>
            </div>
        </div>
        ${site?`<div style="margin-top:12px;padding:10px 14px;background:var(--ok-bg);border:1px solid rgba(34,197,94,.2);border-radius:var(--r);font-size:13px;display:flex;align-items:center;gap:8px">
            <span class="material-icons-outlined" style="font-size:18px;color:var(--ok)">check_circle</span>
            <strong>${esc(sn())}</strong> — ${site.client} ${site.brand?'/ '+site.brand:''} — Hours: ${site.hours}
        </div>`:''}
    </div>
    ${site?`
    <div class="search-box">
        <span class="material-icons-outlined">search</span>
        <input type="text" id="problemSearch" placeholder="Describe the problem (e.g. 'fryers won't turn on', 'it's freezing in the bar')..." oninput="searchProblem(this.value)" onfocus="searchProblem(this.value)" autocomplete="off">
        <div class="search-suggestions" id="suggestions"></div>
    </div>
    <div class="entry-section">
        <div class="entry-title"><span class="material-icons-outlined">help_outline</span> Or select the problem</div>
        <div class="egrid">
            ${PROBLEM_TYPES.map(p=>`<div class="ecard" onclick="selectProblem('${p.flow}')">
                <span class="material-icons-outlined">${p.icon}</span>
                <span>${p.label}</span>
            </div>`).join('')}
        </div>
    </div>
    <div class="entry-section">
        <div class="entry-title"><span class="material-icons-outlined">devices</span> Or by equipment type</div>
        <div class="egrid">
            ${EQUIPMENT_TYPES.map(e=>`<div class="ecard" onclick="selectEquipType('${esc(e.label)}')">
                <span class="material-icons-outlined">${e.icon}</span>
                <span>${e.label}</span>
            </div>`).join('')}
        </div>
    </div>
    `:`<div style="padding:20px;text-align:center;color:var(--txt2)"><span class="material-icons-outlined" style="font-size:40px;display:block;margin-bottom:8px">location_on</span>Select a site above to begin</div>`}
    `;
}

function pickSite(v){site=SITES.find(s=>s.v===v)||null;render()}

function searchProblem(q){
    const box=document.getElementById('suggestions');
    if(!q||q.length<2){box.classList.remove('show');return}
    q=q.toLowerCase();
    const matches=PROBLEM_TYPES.filter(p=>p.keywords.some(k=>q.includes(k))||p.label.toLowerCase().includes(q));
    if(matches.length===0){box.innerHTML='<div class="ss-item" onclick="selectProblem(\'somethingElse\')"><span class="material-icons-outlined">contact_support</span> No match — describe your issue manually</div>';box.classList.add('show');return}
    box.innerHTML=matches.map(p=>`<div class="ss-item" onclick="selectProblem('${p.flow}')"><span class="material-icons-outlined">${p.icon}</span>${p.label}</div>`).join('');
    box.classList.add('show');
}

function selectProblem(f){flow=f;view='intake';render()}

function selectEquipType(label){
    const eq=EQUIPMENT_TYPES.find(e=>e.label===label);
    if(!eq)return;
    const c=document.getElementById('vc');
    c.innerHTML=`
    <div class="form-section">
        <h3><span class="material-icons-outlined">devices</span> ${label} — What's the problem?</h3>
        <div style="display:flex;flex-direction:column;gap:8px">
            ${eq.problems.map(p=>`<div class="ecard" style="flex-direction:row;padding:14px 16px;align-items:center" onclick="selectEquipProblem('${esc(p)}')">
                <span class="material-icons-outlined" style="font-size:20px">arrow_forward</span>
                <span style="font-size:14px">${p}</span>
            </div>`).join('')}
        </div>
        <div style="margin-top:12px"><button class="ab sec" onclick="render()"><span class="material-icons-outlined">arrow_back</span> Back</button></div>
    </div>`;
}

function selectEquipProblem(problem){
    // Map equipment sub-problems to flows
    const map={
        'Too cold':'tooCold','No hot water':'noHotWater','Water not hot enough':'noHotWater',
        'Heating not turning on':'tooCold','Heating not turning off':'tooHot',
        'Fryers not turning on':'kitchenEquip','Equipment keeps turning off':'keepsTurningOff',
        'Oven not working':'kitchenEquip','Equipment making unusual noise':'somethingElse',
        'Fridge/freezer alarm':'fridgeAlarm','Fridge/freezer too warm':'fridgeAlarm',
        'Fridge/freezer not turning on':'fridgeAlarm','Beer cellar too warm':'fridgeAlarm',
        'AC blowing cold':'tooCold','AC blowing warm':'tooHot',
        'AC not turning on':'wontTurnOn','AC making noise':'somethingElse',
        'Equipment not responding':'wontTurnOn','Display showing error':'somethingElse',
        'Thermostat blank':'wontTurnOn'
    };
    // Find best match
    flow=null;
    for(const[key,val] of Object.entries(map)){
        if(problem.toLowerCase().includes(key.toLowerCase())){flow=val;break}
    }
    if(!flow) flow='somethingElse';
    caller.reportedProblem=problem;
    view='intake';
    render();
}

// --- TOO COLD ---
tooCold(){
    addSys('Starting: <strong>Temperature Issue — Too Cold</strong>','play_arrow');
    addSys('Connecting to Salus for '+sn()+'...','sync');
    setTimeout(()=>{
        // Auto-check: are zones online?
        const offline=ZONES.filter(z=>!z.online);
        if(offline.length>0){
            addBot('<strong style="color:var(--err)">⚠ Some heating zones are offline:</strong> '+offline.map(z=>z.zone).join(', ')+'. We cannot control these remotely.');
        }
        const online=ZONES.filter(z=>z.online);
        addSys(online.length+' heating zone(s) online, '+offline.length+' offline','check_circle');
        addBot("Where is the temperature low?");
        addActs(online.map(z=>({
            label:z.zone+' — currently '+z.temp+'°C (set to '+z.setpoint+'°C)',
            fn:'coldZone_'+z.zone,
            cls:z.temp<z.setpoint-2?'':'sec'
        })));
        render();
    },800);
},

coldZone_Bar(){this._coldZone(ZONES[0])},
coldZone_Kitchen(){this._coldZone(ZONES[1])},
coldZone_Dining(){this._coldZone(ZONES[2])},
coldZone_Accommodation(){this._coldZone(ZONES[3])},
coldZone_Cellar(){this._coldZone(ZONES[4])},

_coldZone(z){
    addAg(z.zone+' — '+z.temp+'°C');
    const diff=z.setpoint-z.temp;
    if(diff<=1){
        addBot(z.zone+' is only <strong>'+diff.toFixed(1)+'°C</strong> below setpoint. It may just need time to reach temperature.');
        addActs([
            {label:'Boost anyway (+3°C for 2 hours)',fn:'coldBoost_'+z.zone},
            {label:'No boost needed — any other areas?',fn:'coldAnyMore',cls:'sec'},
        ]);
    } else {
        addBot(z.zone+' is <strong>'+diff.toFixed(1)+'°C below setpoint</strong>. A temporary boost should help.');
        // Check if accommodation — different rules
        if(z.zone==='Accommodation'){
            addBot('<em>Accommodation boost: standard 2-hour duration applies.</em>');
        } else {
            addBot('<em>Non-accommodation zone: boost will auto-cancel at 23:30 if still active (site closes at '+site.hours.split('-')[1]+').</em>');
        }
        addActs([
            {label:'Boost '+z.zone+' (+3°C for 2 hours)',fn:'coldBoost_'+z.zone,cls:'ok'},
            {label:'Any other areas cold?',fn:'coldAnyMore',cls:'sec'},
        ]);
    }
    render();
},

coldBoost_Bar(){this._doBoost(ZONES[0])},
coldBoost_Kitchen(){this._doBoost(ZONES[1])},
coldBoost_Dining(){this._doBoost(ZONES[2])},
coldBoost_Accommodation(){this._doBoost(ZONES[3])},
coldBoost_Cellar(){this._doBoost(ZONES[4])},

_doBoost(z){
    addAg('Boost '+z.zone);
    addSys('Sending setpoint change: '+z.setpoint+'°C → '+(z.setpoint+3)+'°C...','sync');
    setTimeout(()=>{
        addSys('Setpoint updated ✓ — Auto-revert registered for '+revTime(),'timer');
        addRes('<strong>'+z.zone+' boosted.</strong> Setpoint increased to '+(z.setpoint+3)+'°C. Will auto-revert in 2 hours.');
        summary.push('Boosted '+z.zone+' from '+z.setpoint+'°C to '+(z.setpoint+3)+'°C, auto-reverts at '+revTime());
        addScript("<strong>Read to caller:</strong>\n\n<em>\"I've increased the heating in the "+z.zone+" for you. It should start to warm up in the next 15-30 minutes. The boost will last for 2 hours and then go back to normal automatically. Is there anything else I can help with?\"</em>");
        addActs([
            {label:'Caller has another issue',fn:'coldAnyMore'},
            {label:'No more issues — wrap up call',fn:'goWrapUp',cls:'ok'},
        ]);
        render();
    },600);
},

coldAnyMore(){
    addBot("Are any other areas too cold?");
    const online=ZONES.filter(z=>z.online);
    addActs([
        ...online.map(z=>({label:z.zone+' — '+z.temp+'°C',fn:'coldZone_'+z.zone,cls:z.temp<z.setpoint-2?'':'sec'})),

    render();

kitchenEquip(){
    addSys('Starting: <strong>Kitchen Equipment Issue</strong>','play_arrow');
    addSys('Checking Tuya for device at '+sn()+'...','sync');
    setTimeout(()=>{
        const dev={name:'Fryer Bank Switch',state:false,lastChange:'22:00 last night',online:true};
        // Check schedule
        const hour=new Date().getHours();
        const scheduleOn=SCHEDULES.find(s=>s.action==='ON'&&s.enabled);
        const scheduleOff=SCHEDULES.find(s=>s.action==='OFF'&&s.enabled);
        const shouldBeOn=hour>=parseInt(scheduleOn?.time)||false; // Simplified

        addSys('Device found: '+dev.name+' — '+(dev.online?'Connected ✓':'DISCONNECTED ✗'),'check_circle');

        if(!dev.online){
            addBot("<strong style='color:var(--err)'>Device is DISCONNECTED.</strong> We cannot control this equipment remotely. The issue is a connectivity problem, not an equipment fault.");
            addEsc("<strong>Connectivity Issue — Cannot Control Equipment</strong>\n\nThe smart switch at "+sn()+" is not connected to the platform. This may be a network, power, or hardware issue with the IoT controller.",'high');
            summary.push('Escalated: fryer switch disconnected at '+sn());
            const isTradeAffecting=hour>=6&&hour<=14; // Morning = trade affecting
            if(isTradeAffecting){
                addBot('<span class="sev crit">P1 — TRADE AFFECTING</span> This is during service hours. Kitchen cannot operate without fryers.');
            }
            addScript("<strong>Read to caller:</strong>\n\n<em>\"I'm sorry, but we're unable to control the equipment remotely at the moment because the controller isn't connected. I'll escalate this as a priority to the IoT team. Someone will be in contact within "+(isTradeAffecting?"2 hours":"4 hours, or between 8am and 5pm")+".\"</em>");
            addActs([{label:'Wrap up call',fn:'goWrapUp',cls:'ok'}]);
            render();
            return;
        }

        addBot("The <strong>"+dev.name+"</strong> is currently <strong style='color:var(--err)'>OFF</strong>.\n\nLast state change: "+dev.lastChange+" (scheduled off).\n\nSchedule says next ON: <strong>"+scheduleOn.time+" ("+scheduleOn.days+")</strong>.");

        if(shouldBeOn){
            addBot("Based on the schedule, this equipment <strong>should be on right now</strong>. It may have been turned off manually or the schedule failed.");
        } else {
            addBot("Based on the schedule, this equipment is <strong>correctly off</strong> — it's not due to turn on until "+scheduleOn.time+".");

        addBot("Before we can turn this on, I need to understand why.");
        addActs([
            {label:'Early start — site opening earlier than usual',fn:'kitchenEarly'},
            {label:'Schedule is wrong — they always need it on by now',fn:'kitchenScheduleWrong'},
            {label:'Equipment turned off unexpectedly during service',fn:'kitchenUnexpectedOff'},

        <div style="background:rgba(139,92,246,.06);border:1px solid rgba(139,92,246,.15);border-radius:var(--rs);padding:14px;font-size:13px;line-height:1.6;font-style:italic;margin-bottom:16px">
            "Is there anything else you called about today?"<br><br>
            <em style="font-style:normal;color:var(--txt2)">[If yes → start new triage. If no → continue below]</em><br><br>
            "Thank you for calling, ${esc(caller.name||'')}.${summary.some(s=>s.includes('Escalated'))?' As I mentioned, someone from the team will be in touch.':''} Have a good ${new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening'}."
        </div>
    </div>

    <div class="form-section">
        <h3><span class="material-icons-outlined">summarize</span> Triage Summary</h3>
        <div style="background:var(--bg);border:1px solid var(--bdr);border-radius:var(--rs);padding:14px;font-family:monospace;font-size:11px;line-height:1.6;white-space:pre-wrap;max-height:200px;overflow-y:auto">=== OOH Triage Summary ===
Flow: ${flow}
Site: ${sn()} (${site?.no||'N/A'}) — ${site?.client||''}
Caller: ${caller.name||'N/A'} (${caller.role||'N/A'}) — ${caller.phone||'N/A'}
Duration: ${dur} min
${caller.desc?'Description: '+caller.desc+'\n':''}
${summary.join('\n')}</div>
    </div>

    <div style="display:flex;gap:8px;margin-top:12px">
        <button class="ab ok" onclick="toast('Summary posted to Zendesk','check_circle')"><span class="material-icons-outlined">note_add</span> Post to Zendesk & Close</button>
        <button class="ab" onclick="goHome()"><span class="material-icons-outlined">add_call</span> Caller has another issue</button>
    </div>`;
}

// ============================================================================
// TRIAGE VIEW RENDERER
// ============================================================================
function renderTriage(c){
    const flowNames={tooCold:'Too Cold',tooHot:'Too Hot',noHotWater:'No Hot Water',kitchenEquip:'Kitchen Equipment',fridgeAlarm:'Fridge/Freezer',wontTurnOn:"Won't Turn On",keepsTurningOff:'Keeps Turning Off',somethingElse:'General Issue'};
    const flowIcons={tooCold:'thermostat',tooHot:'whatshot',noHotWater:'water_drop',kitchenEquip:'restaurant',fridgeAlarm:'kitchen',wontTurnOn:'power_off',keepsTurningOff:'power_settings_new',somethingElse:'contact_support'};

    document.getElementById('pageTitle').textContent=flowNames[flow]||'Triage';

    let chatHtml=msgs.map((m,i)=>{
        if(m.r==='acts') return '<div class="acts">'+m.a.map(a=>'<button class="ab '+(a.cls||'')+'" onclick="FLOWS[\''+a.fn+'\']()">'+a.label+'</button>').join('')+'</div>';
        if(m.r==='data') return m.h;
        if(m.r==='freetext') return '<div style="padding:8px 0"><textarea id="freeTextInput" style="width:100%;min-height:80px;padding:10px;border:1px solid var(--bdr);border-radius:var(--rs);font-family:inherit;font-size:13px" placeholder="Describe the issue in detail..."></textarea><button class="ab ok" style="margin-top:8px" onclick="FLOWS.submitFreeText()"><span class="material-icons-outlined">send</span> Submit</button></div>';
        const cls={bot:'msg-bot',agent:'msg-agent',sys:'msg-sys',err:'msg-err',esc:'msg-esc',res:'msg-res',script:'msg-script'}[m.r]||'msg-bot';
        return '<div class="msg '+cls+'"><div class="mh"><span class="material-icons-outlined">'+m.i+'</span> '+m.tm+(m.sev?' <span class="sev '+m.sev+'">'+m.sev.toUpperCase()+'</span>':'')+'</div><div class="mt">'+m.t+'</div></div>';
    }).join('');

    let sidebar=buildSidebar();

    c.innerHTML=`
    <div class="steps">
        <div class="step done"><span class="material-icons-outlined">check_circle</span> New Call</div>
        <div class="step done"><span class="material-icons-outlined">check_circle</span> Caller Details</div>
        <div class="step done"><span class="material-icons-outlined">check_circle</span> Identify Problem</div>
        <div class="step active"><span class="material-icons-outlined">chat</span> Triage</div>
        <div class="step">Wrap Up</div>
    </div>
    <div class="tl">
        <div class="tc">
            <div class="th">
                <button class="ab sec" onclick="goHome()"><span class="material-icons-outlined">close</span> Abort</button>
                <div class="tfn"><span class="material-icons-outlined">${flowIcons[flow]||'chat'}</span>${flowNames[flow]||'Triage'}</div>
                <div style="width:80px"></div>
            </div>
            <div class="ca" id="chatArea">${chatHtml}</div>
        </div>
        <div class="ts">${sidebar}</div>
    </div>`;

    const chat=document.getElementById('chatArea');
    if(chat)chat.scrollTop=chat.scrollHeight;
}

function buildSidebar(){
    let s='';

    // Data card — heating zones
    if(flow==='tooCold'||flow==='tooHot'){
        s+='<div class="dc"><h4><span class="material-icons-outlined" style="font-size:16px">thermostat</span> Heating Zones</h4>';
        s+='<table class="dt"><tr><th>Zone</th><th>Temp</th><th>Set</th><th>Status</th></tr>';
        ZONES.forEach(z=>{
            const cold=z.temp<z.setpoint-2;
            s+='<tr class="'+(cold?'hl':'')+'"><td>'+z.zone+'</td><td><strong>'+z.temp+'°C</strong></td><td>'+z.setpoint+'°C</td><td><span class="sd '+(z.status==='heating'?'a':z.status==='idle'?'g':'r')+'"></span>'+z.status+'</td></tr>';
        });
        s+='</table></div>';
    }

    // Data card — kitchen equipment
    if(flow==='kitchenEquip'||flow==='keepsTurningOff'){
        s+='<div class="dc"><h4><span class="material-icons-outlined" style="font-size:16px">power</span> Device</h4>';
        s+='<table class="dt"><tr><th>Device</th><th>State</th><th>Connected</th></tr>';
        s+='<tr><td>Fryer Bank Switch</td><td><strong style="color:var(--err)">OFF</strong></td><td><span class="sd g"></span>Yes</td></tr></table></div>';
        s+='<div class="dc"><h4><span class="material-icons-outlined" style="font-size:16px">schedule</span> Schedules</h4>';
        s+='<table class="dt"><tr><th>Name</th><th>Time</th><th>Action</th><th>Days</th></tr>';
        SCHEDULES.forEach(sc=>{s+='<tr><td>'+sc.name+'</td><td>'+sc.time+'</td><td>'+sc.action+'</td><td>'+sc.days+'</td></tr>'});
        s+='</table></div>';
    }

    // Pocket change
    if(summary.some(x=>x.includes('Boosted')||x.includes('Switched on'))){
        s+='<div class="pc"><h4><span class="material-icons-outlined" style="font-size:14px">timer</span> Active Override</h4>';
        s+='<div style="font-size:18px;font-weight:700;color:#92400e">1h 58m remaining</div>';
        s+='<div style="font-size:12px;margin-top:4px">Auto-reverts at '+revTime()+'</div></div>';
    }

    // Caller + context
    s+='<div class="cc"><h4>Call Details</h4>';
    if(caller.name) s+='<div class="cr"><span>Caller</span><span>'+esc(caller.name)+'</span></div>';
    if(caller.role) s+='<div class="cr"><span>Role</span><span>'+caller.role+'</span></div>';
    if(caller.phone) s+='<div class="cr"><span>Phone</span><span>'+caller.phone+'</span></div>';
    if(site){
        s+='<div class="cr"><span>Site</span><span>'+sn()+'</span></div>';
        s+='<div class="cr"><span>Site #</span><span>'+site.no+'</span></div>';
        s+='<div class="cr"><span>Client</span><span>'+site.client+'</span></div>';
        s+='<div class="cr"><span>Hours</span><span>'+site.hours+'</span></div>';
    }
    s+='</div>';

    return s;
}

// ============================================================================
// POCKET CHANGES VIEW
// ============================================================================
function showPocketChanges(){
    view='pocket';render();
}

function renderPocket(c){
    document.getElementById('pageTitle').textContent='Active Overrides';
    c.innerHTML=`
    <div style="max-width:800px">
        <h2 style="display:flex;align-items:center;gap:8px;font-size:18px;margin-bottom:16px"><span class="material-icons-outlined">timer</span> Active Overrides (Pocket Changes)</h2>
        <h3 style="font-size:14px;color:var(--txt2);margin-bottom:10px">Active (1)</h3>
        <div class="dc" style="border-left:3px solid var(--warn);margin-bottom:12px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
                <strong>+3°C heating boost — Bar Area</strong>
                <span style="font-size:18px;font-weight:700;color:#92400e">1h 42m</span>
            </div>
            <div style="font-size:12px;color:var(--txt2);margin-bottom:8px">
                Site: 10234 - The Red Lion | Service: Salus | Reason: Customer reported bar area too cold<br>
                Agent: OOH Handler | Caller: John Smith (Duty Manager) | Created: ${now()}
            </div>
            <div style="display:flex;gap:8px">
                <button class="ab sec" onclick="toast('Revert cancelled','check_circle')">Cancel Revert</button>
                <button class="ab sec" onclick="toast('Extended by 60 min','check_circle')">Extend +60 min</button>
            </div>
        </div>
        <h3 style="font-size:14px;color:var(--txt2);margin:24px 0 10px">Recent History</h3>
        <div class="dc" style="border-left:3px solid var(--ok);margin-bottom:8px;opacity:.7">
            <div style="display:flex;justify-content:space-between"><strong>Fryer switch ON — The White Hart</strong><span class="sev med" style="background:var(--ok-bg);color:var(--ok)">REVERTED</span></div>
            <div style="font-size:12px;color:var(--txt2)">23 Mar, 02:15 — Tuya — Auto-reverted at 04:15</div>
        </div>
        <div class="dc" style="border-left:3px solid var(--err);margin-bottom:8px;opacity:.7">
            <div style="display:flex;justify-content:space-between"><strong>AC mode change — The Stag</strong><span class="sev crit">FAILED</span></div>
            <div style="font-size:12px;color:var(--txt2)">21 Mar, 01:55 — Intesis — P1 review ticket #28490 created</div>
        </div>
        <div style="margin-top:16px"><button class="ab sec" onclick="goHome()"><span class="material-icons-outlined">arrow_back</span> Back to Triage</button></div>
    </div>`;
}

// ============================================================================
// INIT
// ============================================================================
render();
setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+' — Out of Hours'},30000);
</script>
</body>
</html>
