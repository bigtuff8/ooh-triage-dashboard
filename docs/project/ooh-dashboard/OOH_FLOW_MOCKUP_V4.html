<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OOH Triage Flows — Mockup v4</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f1f5f9;color:#1e293b}
:root{--pri:#3b82f6;--pri-bg:rgba(59,130,246,.06);--ok:#22c55e;--ok-bg:rgba(34,197,94,.06);--warn:#f59e0b;--warn-bg:rgba(245,158,11,.06);--err:#ef4444;--err-bg:rgba(239,68,68,.06);--txt:#1e293b;--txt2:#64748b;--surf:#fff;--bdr:#e2e8f0;--bg:#f8fafc;--r:10px;--rs:6px}
.app{display:flex;height:100vh}
.sb{width:260px;background:var(--surf);border-right:1px solid var(--bdr);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sb-hdr{padding:20px 16px 12px;border-bottom:1px solid var(--bdr)}
.sb-hdr h2{font-size:16px;display:flex;align-items:center;gap:8px}
.sb-hdr p{font-size:11px;color:var(--txt2);margin-top:4px}
.ns{padding:12px 8px 4px}
.nl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--txt2);padding:0 8px 6px}
.ni{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--rs);cursor:pointer;font-size:13px;font-weight:500;color:var(--txt);transition:all .12s}
.ni:hover{background:var(--bg)}.ni.act{background:var(--pri-bg);color:var(--pri)}
.ni .material-icons-outlined{font-size:18px}
.nb{margin-left:auto;font-size:10px;padding:2px 7px;border-radius:10px;background:var(--pri);color:#fff;font-weight:600}
.mn{flex:1;display:flex;flex-direction:column;overflow:hidden}
.tb{padding:14px 24px;background:var(--surf);border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between}
.tb h1{font-size:18px}.tb-r{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--txt2)}
.ct{flex:1;overflow-y:auto;padding:20px 24px}
.form-section{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:20px;margin-bottom:20px}
.form-section h3{font-size:15px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg.full{grid-column:1/-1}
.fg label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--txt2)}
.fg label .req{color:var(--err)}
.fg input,.fg select,.fg textarea{padding:9px 11px;border:1px solid var(--bdr);border-radius:var(--rs);font-size:13px;font-family:inherit;background:var(--bg)}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--pri)}
.fg textarea{resize:vertical;min-height:60px}
.fg .help{font-size:11px;color:var(--txt2);margin-top:2px}
.entry-section{margin-bottom:24px}
.entry-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-bottom:12px}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.ecard{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 16px;background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);cursor:pointer;text-align:center;transition:all .15s;position:relative}
.ecard:hover{border-color:var(--pri);box-shadow:0 2px 8px rgba(0,0,0,.06);transform:translateY(-1px)}
.ecard .material-icons-outlined{font-size:28px;color:var(--pri)}
.ecard span:last-of-type{font-size:13px;font-weight:500}
.search-box{position:relative;margin-bottom:20px}
.search-box input{width:100%;padding:12px 12px 12px 40px;border:1px solid var(--bdr);border-radius:var(--r);font-size:14px;font-family:inherit;background:var(--surf)}
.search-box input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.search-box .material-icons-outlined{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--txt2);font-size:20px}
.search-suggestions{position:absolute;top:100%;left:0;right:0;background:var(--surf);border:1px solid var(--bdr);border-radius:var(--rs);box-shadow:0 8px 24px rgba(0,0,0,.1);margin-top:4px;z-index:10;display:none;max-height:240px;overflow-y:auto}
.search-suggestions.show{display:block}
.ss-item{padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:13px;border-bottom:1px solid rgba(0,0,0,.04)}
.ss-item:hover{background:var(--pri-bg)}
.ss-item .material-icons-outlined{font-size:18px;color:var(--pri)}
.tl{display:flex;gap:16px;height:calc(100vh - 160px)}
.tc{flex:1;display:flex;flex-direction:column;min-width:0}
.ts{width:340px;flex-shrink:0;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.th{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);margin-bottom:8px}
.tfn{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.ca{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px}
.msg{padding:12px 14px;border-radius:var(--r);border-left:3px solid var(--pri);background:var(--surf);font-size:13px;line-height:1.6}
.msg-bot{border-left-color:var(--pri)}.msg-agent{border-left-color:var(--ok);background:var(--ok-bg)}
.msg-sys{border-left-color:var(--txt2);background:var(--bg);font-size:12px}
.msg-esc{border-left-color:var(--warn);background:var(--warn-bg)}
.msg-res{border-left-color:var(--ok);background:var(--ok-bg)}
.msg-script{border-left-color:#8b5cf6;background:rgba(139,92,246,.06)}
.msg-rules{border-left-color:#8b5cf6;background:rgba(139,92,246,.04);font-size:12px}
.mh{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:12px;color:var(--txt2)}
.mh .material-icons-outlined{font-size:16px}
.mt{color:var(--txt)}.mt strong{font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0}
.ab{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;background:var(--surf);border:1px solid var(--pri);border-radius:var(--rs);color:var(--pri);font-size:13px;font-weight:500;cursor:pointer;transition:all .12s;font-family:inherit}
.ab:hover{background:var(--pri);color:#fff}
.ab.err{border-color:var(--err);color:var(--err)}.ab.err:hover{background:var(--err);color:#fff}
.ab.ok{border-color:var(--ok);color:var(--ok)}.ab.ok:hover{background:var(--ok);color:#fff}
.ab.sec{border-color:var(--bdr);color:var(--txt2)}.ab.sec:hover{background:var(--bg);color:var(--txt)}
.ab .material-icons-outlined{font-size:16px}
.dc{padding:14px;background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);font-size:13px}
.dc h4{margin:0 0 10px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.dt{width:100%;border-collapse:collapse}
.dt th{text-align:left;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;color:var(--txt2);padding:6px 8px;border-bottom:1px solid var(--bdr)}
.dt td{padding:8px;border-bottom:1px solid rgba(0,0,0,.04);font-size:12px}
.dt tr:last-child td{border-bottom:none}.dt tr.hl{background:var(--pri-bg)}
.sd{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.sd.g{background:var(--ok)}.sd.r{background:var(--err)}.sd.a{background:var(--warn)}
.cc{padding:14px;background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r)}
.cc h4{margin:0 0 8px;font-size:13px;font-weight:600}
.cr{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--bdr);font-size:12px}
.cr:last-child{border-bottom:none}.cr span:first-child{color:var(--txt2)}
.pc{padding:12px;background:var(--warn-bg);border:1px solid rgba(245,158,11,.2);border-radius:var(--r)}
.pc h4{margin:0 0 6px;font-size:12px;font-weight:600;color:#92400e;display:flex;align-items:center;gap:4px}
.sev{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:600}
.sev.crit{background:var(--err-bg);color:var(--err)}.sev.high{background:var(--warn-bg);color:#92400e}
.sev.med{background:var(--pri-bg);color:var(--pri)}
.toast{position:fixed;bottom:20px;right:20px;background:#1e293b;color:#fff;padding:12px 20px;border-radius:var(--rs);font-size:13px;display:flex;align-items:center;gap:8px;transform:translateY(80px);opacity:0;transition:all .3s;z-index:999}
.toast.show{transform:translateY(0);opacity:1}.toast .material-icons-outlined{font-size:18px}
.steps{display:flex;align-items:center;gap:0;margin-bottom:20px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:6px;padding:8px 16px;font-size:12px;font-weight:500;color:var(--txt2);position:relative}
.step.active{color:var(--pri);font-weight:600}.step.done{color:var(--ok)}
.step::after{content:'>';margin-left:12px;font-size:16px;color:var(--bdr)}.step:last-child::after{display:none}
.step .material-icons-outlined{font-size:16px}
.detail-capture{background:var(--bg);border:1px solid var(--bdr);border-radius:var(--rs);padding:12px;margin:8px 0}
.detail-capture label{font-size:11px;font-weight:600;color:var(--txt2);display:block;margin-bottom:4px}
.detail-capture textarea,.detail-capture select,.detail-capture input{width:100%;padding:8px;border:1px solid var(--bdr);border-radius:var(--rs);font-size:13px;font-family:inherit;margin-bottom:8px}
.rules-box{background:rgba(139,92,246,.06);border:1px solid rgba(139,92,246,.15);border-radius:var(--rs);padding:12px;margin:6px 0;font-size:12px;line-height:1.6}
.rules-box strong{color:#7c3aed}

/* === MODAL === */
.modal-backdrop{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.65);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-backdrop.open{opacity:1;pointer-events:all}
.modal{background:var(--surf);border-radius:12px;width:720px;max-width:92vw;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);transform:translateY(20px);transition:transform .25s}
.modal-backdrop.open .modal{transform:translateY(0)}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--bdr);position:sticky;top:0;background:var(--surf);z-index:2;border-radius:12px 12px 0 0}
.modal-hdr h2{font-size:16px;display:flex;align-items:center;gap:8px}
.modal-body{padding:20px 24px}
.modal-section{margin-bottom:20px}
.modal-section h4{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--txt2);margin-bottom:10px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--bdr);padding-bottom:6px}
.modal-kv{display:flex;justify-content:space-between;padding:4px 0;font-size:12px;border-bottom:1px solid rgba(0,0,0,.04)}
.modal-kv span:first-child{color:var(--txt2);min-width:120px}
.modal-log{max-height:220px;overflow-y:auto;border:1px solid var(--bdr);border-radius:var(--rs);padding:8px}
.modal-log-item{padding:4px 8px;font-size:11px;line-height:1.5;border-bottom:1px solid rgba(0,0,0,.03)}
.modal-log-item:last-child{border-bottom:none}
.modal-log-item .log-time{color:var(--txt2);margin-right:6px;font-weight:600}
.modal-log-item .log-role{font-weight:600;margin-right:4px}
.modal-log-item .log-role.bot{color:var(--pri)}
.modal-log-item .log-role.agent{color:var(--ok)}
.modal-log-item .log-role.sys{color:var(--txt2)}
.modal-log-item .log-role.esc{color:var(--warn)}
.modal-ftr{display:flex;gap:8px;justify-content:flex-end;padding:16px 24px;border-top:1px solid var(--bdr);position:sticky;bottom:0;background:var(--surf);border-radius:0 0 12px 12px}

::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
@media(max-width:900px){.sb{display:none}.tl{flex-direction:column;height:auto}.ts{width:100%}.form-grid{grid-template-columns:1fr}.egrid{grid-template-columns:repeat(2,1fr)}.modal{width:98vw}}
</style>
</head>
<body>
<div class="app">
<aside class="sb">
    <div class="sb-hdr"><h2><span class="material-icons-outlined" style="color:var(--pri)">support_agent</span> OOH Triage</h2><p>Out-of-hours call handler</p></div>
    <div class="ns"><div class="nl">Triage</div><div class="ni act" onclick="goHome()" id="navHome"><span class="material-icons-outlined">home</span> New Call</div></div>
    <div class="ns"><div class="nl">Monitor</div><div class="ni" onclick="showPocket()"><span class="material-icons-outlined">timer</span> Active Overrides <span class="nb">1</span></div></div>
    <div style="margin-top:auto;padding:12px 16px;font-size:11px;color:var(--txt2);border-top:1px solid var(--bdr)">OOH Mockup v4 — 24 Mar 2026</div>
</aside>
<div class="mn">
    <div class="tb"><h1 id="pT">New Call</h1><div class="tb-r"><span class="material-icons-outlined" style="font-size:16px">schedule</span><span id="clk"></span></div></div>
    <div class="ct" id="vc"></div>
</div>
</div>
<div class="toast" id="toast"><span class="material-icons-outlined" id="tI">check_circle</span><span id="tM"></span></div>
<div class="modal-backdrop" id="escModal">
    <div class="modal">
        <div class="modal-hdr"><h2 id="escModalTitle">Escalation Review</h2><button class="ab sec" onclick="closeEscModal()" style="padding:6px 10px"><span class="material-icons-outlined">close</span></button></div>
        <div class="modal-body" id="escModalBody"></div>
        <div class="modal-ftr">
            <button class="ab sec" onclick="editAndGoBack()"><span class="material-icons-outlined">edit</span> Edit & Go Back</button>
            <button class="ab ok" onclick="submitEscalation()"><span class="material-icons-outlined">send</span> Submit Escalation</button>
        </div>
    </div>
</div>
<script>
// === DATA ===
const SITES=[
{v:'gk_fi_10234',name:'Greene King::Farmhouse Inns::10234 - The Red Lion, Leeds',no:'10234',hours:'11:00-23:00',client:'Greene King',brand:'Farmhouse Inns'},
{v:'gk_fi_10567',name:'Greene King::Farmhouse Inns::10567 - The White Hart, York',no:'10567',hours:'11:00-23:30',client:'Greene King',brand:'Farmhouse Inns'},
{v:'gk_fg_11002',name:'Greene King::Flaming Grill::11002 - The George & Dragon, Bradford',no:'11002',hours:'11:00-23:00',client:'Greene King',brand:'Flaming Grill'},
{v:'gk_cb_12100',name:'Greene King::Chef & Brewer::12100 - The Stag, Harrogate',no:'12100',hours:'10:00-23:30',client:'Greene King',brand:'Chef & Brewer'},
{v:'mcd_20001',name:'McDonalds::20001 - Leeds City Centre',no:'20001',hours:'06:00-01:00',client:'McDonalds',brand:''},
];
const ZONES=[
{zone:'Bar',temp:14.2,sp:18,mode:'Auto',id:'s1',st:'heating',on:true},
{zone:'Kitchen',temp:19.8,sp:20,mode:'Auto',id:'s2',st:'idle',on:true},
{zone:'Dining',temp:13.5,sp:18,mode:'Auto',id:'s3',st:'heating',on:true},
{zone:'Accommodation',temp:16.1,sp:18,mode:'Auto',id:'s4',st:'heating',on:true},
{zone:'Cellar',temp:11.2,sp:12,mode:'Auto',id:'s5',st:'idle',on:true},
];
const SCHEDS=[
{name:'Morning On',time:'05:30',act:'ON',on:true,days:'Mon-Fri'},
{name:'Evening Off',time:'22:00',act:'OFF',on:true,days:'Mon-Fri'},
{name:'Weekend On',time:'07:00',act:'ON',on:true,days:'Sat-Sun'},
{name:'Weekend Off',time:'20:00',act:'OFF',on:true,days:'Sat-Sun'},
];
const INTESIS_UNITS=[
{name:'Bar AC Unit 1',power:'On',mode:'Cool',setpoint:16,roomTemp:22.4,id:'int-001'},
{name:'Bar AC Unit 2',power:'Off',mode:'Auto',setpoint:21,roomTemp:22.1,id:'int-002'},
{name:'Dining AC',power:'On',mode:'Cool',setpoint:14,roomTemp:18.3,id:'int-003'},
];
const EQUIPMENT_TYPES=[
{label:'Heating & Hot Water',icon:'thermostat',subs:['Too cold / heating not working','No hot water','Water not hot enough','Heating won\'t turn off']},
{label:'Kitchen Equipment',icon:'restaurant',subs:['Fryers not turning on','Ovens/grills not working','Equipment keeps turning off','Equipment making unusual noise']},
{label:'Refrigeration',icon:'kitchen',subs:['Fridge/freezer alarm going off','Fridge/freezer temperature too high','Fridge/freezer not turning on','Beer cellar too warm']},
{label:'Air Conditioning',icon:'ac_unit',subs:['AC blowing cold when should be warm','AC blowing warm when should be cool','AC not turning on','AC won\'t turn off']},
{label:'Controls & Displays',icon:'settings_remote',subs:['Thermostat blank / unresponsive','Display showing error code','Control panel not responding','Other']},
];
const PROBLEMS=[
{label:"It's too cold in here",icon:'ac_unit',fl:'tooCold',kw:['cold','freezing','heating','warm','temperature','chilly']},
{label:"It's too hot in here",icon:'whatshot',fl:'tooHot',kw:['hot','warm','overheating','boiling','sweltering']},
{label:'No hot water',icon:'water_drop',fl:'noHotWater',kw:['hot water','water','shower','tap','dhw','boiler']},
{label:'Kitchen equipment not working',icon:'restaurant',fl:'kitchenEquip',kw:['fryer','oven','kitchen','grill','equipment','cook','food']},
{label:'Fridge or freezer problem',icon:'kitchen',fl:'fridgeIssue',kw:['fridge','freezer','alarm','cold room','walk-in','temperature','beer','cellar']},
{label:'Equipment won\'t turn on',icon:'power_off',fl:'wontTurnOn',kw:['turn on','power','switch','won\'t start','not working','dead']},
{label:'Equipment keeps turning off',icon:'power_settings_new',fl:'keepsTurningOff',kw:['turning off','keeps going off','switching off','cuts out','trips']},
{label:'Display showing error / controls not working',icon:'settings_remote',fl:'controlsIssue',kw:['display','error','thermostat','blank','code','control','panel','screen']},
{label:'Something else',icon:'contact_support',fl:'somethingElse',kw:[]},
];

// === STATE ===
let view='landing',flow=null,msgs=[],site=null,caller={},summary=[],fs=null;
let actionsTaken=[];
let dataSnapshots=[];
let escalationData=null;
let agentNotes='';

// === CORE ===
function render(){const c=document.getElementById('vc');({landing:renderLanding,intake:renderIntake,triage:renderTriage,wrapUp:renderWrapUp,pocket:renderPocket}[view]||renderLanding)(c);tick()}
function tick(){document.getElementById('clk').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+' — Out of Hours'}
function goHome(){view='landing';flow=null;msgs=[];summary=[];actionsTaken=[];dataSnapshots=[];escalationData=null;agentNotes='';caller={};site=null;render()}
function newIssue(){view='landing';flow=null;msgs=[];summary=[];actionsTaken=[];dataSnapshots=[];escalationData=null;agentNotes='';render()}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function sn(){return site?site.name.split('::').pop():'Unknown Site'}
function now(){return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function rv(){return new Date(Date.now()+7200000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function toast(m,i){const t=document.getElementById('toast');document.getElementById('tM').textContent=m;document.getElementById('tI').textContent=i||'check_circle';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
function isServiceHours(){const h=new Date().getHours();return h>=6&&h<22}
function closeTime(){return site?site.hours.split('-')[1]:'23:00'}

const FLOW_NAMES={tooCold:'Too Cold',tooHot:'Too Hot',noHotWater:'No Hot Water',kitchenEquip:'Kitchen Equipment',fridgeIssue:'Refrigeration',wontTurnOn:"Won't Turn On",keepsTurningOff:'Keeps Turning Off',controlsIssue:'Controls / Display',somethingElse:'General Issue',heatingStuck:'Heating Won\'t Turn Off',ovensGrills:'Ovens / Grills',acColdWarm:'AC Mode Issue',acWarmCool:'AC Mode Issue',acWontOff:'AC Won\'t Turn Off'};
const FLOW_ICONS={tooCold:'thermostat',tooHot:'whatshot',noHotWater:'water_drop',kitchenEquip:'restaurant',fridgeIssue:'kitchen',wontTurnOn:'power_off',keepsTurningOff:'power_settings_new',controlsIssue:'settings_remote',somethingElse:'contact_support',heatingStuck:'thermostat',ovensGrills:'restaurant',acColdWarm:'ac_unit',acWarmCool:'ac_unit',acWontOff:'ac_unit'};

// === STEP 1: LANDING ===
function renderLanding(c){
    document.getElementById('pT').textContent='New Call';
    const hasCaller=!!(caller.name&&caller.phone);
    c.innerHTML=`
    <div class="steps">
        <div class="step active"><span class="material-icons-outlined">call</span> New Call</div>
        <div class="step">Caller Details</div>
        <div class="step">Triage</div>
        <div class="step">Wrap Up</div>
    </div>
    ${hasCaller?`<div style="margin-bottom:16px;padding:10px 14px;background:var(--pri-bg);border:1px solid rgba(59,130,246,.15);border-radius:var(--r);font-size:13px;display:flex;align-items:center;gap:8px">
        <span class="material-icons-outlined" style="font-size:18px;color:var(--pri)">person</span>
        Continuing call with <strong>${esc(caller.name)}</strong> (${esc(caller.phone)}) ${site?' at <strong>'+esc(sn())+'</strong>':''}
    </div>`:''}
    <div class="form-section">
        <h3><span class="material-icons-outlined">location_on</span> Select Site</h3>
        <div class="form-grid"><div class="fg full">
            <label>Site <span class="req">*</span></label>

function pickSubProblem(p){
    const map={
        'Too cold':'tooCold','heating not working':'tooCold',
        'No hot water':'noHotWater','Water not hot enough':'noHotWater',
        'Heating won\'t turn off':'heatingStuck',
        'Fryers not turning on':'kitchenEquip',
        'Ovens/grills not working':'ovensGrills',
        'keeps turning off':'keepsTurningOff',
        'unusual noise':'somethingElse',
        'alarm going off':'fridgeIssue','temperature too high':'fridgeIssue',
        'not turning on':'wontTurnOn','Beer cellar':'fridgeIssue',
        'Fridge/freezer not turning on':'wontTurnOnFridge',
        'blowing cold when should be warm':'acColdWarm',
        'blowing warm when should be cool':'acWarmCool',
        'AC not turning on':'wontTurnOn',
        'AC won\'t turn off':'acWontOff',
        'Thermostat blank':'controlsIssue','error code':'controlsIssue',
        'panel not responding':'controlsIssue','Other':'controlsOther'

    flow='somethingElse';

    var notesEl=document.getElementById('escNotes');

// Helper: trigger escalation modal for a flow

const F={

// --- TOO COLD ---
tooCold(){
    as('Starting: <strong>Temperature Issue</strong>','play_arrow');
    as('Connecting to Salus for '+sn()+'...','sync');
    setTimeout(function(){
        const off=ZONES.filter(z=>!z.on),on=ZONES.filter(z=>z.on);
        if(off.length) ab('<strong style="color:var(--err)">Warning: '+off.length+' zone(s) offline:</strong> '+off.map(z=>z.zone).join(', ')+'. These cannot be controlled remotely.');
        as(on.length+' zone(s) online','check_circle');
        dataSnapshots.push({label:'Heating Zones (Salus)',headers:['Zone','Temp','Setpoint','Status'],rows:ZONES.map(z=>[z.zone,z.temp+'C',z.sp+'C',z.st])});
        ab("Which area is the temperature low?");
        aa(on.map(z=>({label:z.zone+' — currently '+z.temp+'C (set: '+z.sp+'C)',fn:'_cz_'+z.zone,cls:z.temp<z.sp-2?'':'sec'})));
        render();
    },800);
},
_cz_Bar(){F._coldZone(ZONES[0])},_cz_Kitchen(){F._coldZone(ZONES[1])},_cz_Dining(){F._coldZone(ZONES[2])},_cz_Accommodation(){F._coldZone(ZONES[3])},_cz_Cellar(){F._coldZone(ZONES[4])},
_coldZone(z){
    ag(z.zone+' — '+z.temp+'C');
    const d=z.sp-z.temp;
    if(d<=1){ab(z.zone+' is only <strong>'+d.toFixed(1)+'C</strong> below setpoint — it may just need time.');aa([{label:'Boost anyway (+3C, 2 hours)',fn:'_cb_'+z.zone},{label:'No boost needed',fn:'_cmore',cls:'sec'}])}
    else{
        ab(z.zone+' is <strong>'+d.toFixed(1)+'C below setpoint</strong>. A boost should help.');
        if(z.zone!=='Accommodation') ab('<em>Non-accommodation: boost will auto-cancel at 23:30 if still active (site closes '+closeTime()+').</em>');
        aa([{label:'Boost '+z.zone+' (+3C, 2 hours)',fn:'_cb_'+z.zone,cls:'ok'},{label:'Check another area',fn:'_cmore',cls:'sec'}]);
    }
    render();
},
_cb_Bar(){F._doBoost(ZONES[0])},_cb_Kitchen(){F._doBoost(ZONES[1])},_cb_Dining(){F._doBoost(ZONES[2])},_cb_Accommodation(){F._doBoost(ZONES[3])},_cb_Cellar(){F._doBoost(ZONES[4])},
_doBoost(z){
    ag('Boost '+z.zone);as('Sending setpoint change: '+z.sp+'C -> '+(z.sp+3)+'C...','sync');
    setTimeout(function(){
        as('Setpoint updated — Auto-revert at '+rv(),'timer');
        arules('<strong>Rules Applied:</strong> Boost increases setpoint by 3C for 2 hours. The system will automatically revert to the original setpoint ('+z.sp+'C) at '+rv()+'. Non-accommodation zones also auto-cancel at 23:30 to prevent overnight heating waste.');
        ar('<strong>'+z.zone+' boosted.</strong> Setpoint increased to '+(z.sp+3)+'C. Auto-reverts in 2 hours.');
        actionsTaken.push('Boosted '+z.zone+' from '+z.sp+'C to '+(z.sp+3)+'C, reverts '+rv());
        summary.push('Boosted '+z.zone+' from '+z.sp+'C to '+(z.sp+3)+'C, reverts '+rv());
        endFlow('<strong>Read to caller:</strong>\n\n<em>"I\'ve increased the heating in the '+z.zone+' for you. It should start to warm up in the next 15-30 minutes. The boost will last for 2 hours and then return to normal automatically. Is there anything else I can help with?"</em>');
        render();
    },600);
},
_cmore(){ab("Any other areas?");const on=ZONES.filter(z=>z.on);aa([...on.map(z=>({label:z.zone+' — '+z.temp+'C',fn:'_cz_'+z.zone,cls:z.temp<z.sp-2?'':'sec'})),{label:'No — that\'s everything',fn:'goWrap',cls:'ok'}]);render()},

heatingStuck(){

    setTimeout(function(){
        dataSnapshots.push({label:'Heating Zones (Salus)',headers:['Zone','Temp','Setpoint','Mode','Status'],rows:ZONES.map(z=>[z.zone,z.temp+'C',z.sp+'C',z.mode,z.st])});
        // Simulate: Bar zone has a stuck heating issue — temp is above setpoint but still heating
        var stuckZone={zone:'Bar',temp:22.5,sp:18,mode:'Auto',st:'heating'};
        ab("Zone check complete. <strong style='color:var(--warn)'>Anomaly detected:</strong> The <strong>"+stuckZone.zone+"</strong> zone is at <strong>"+stuckZone.temp+"C</strong> but the setpoint is only <strong>"+stuckZone.sp+"C</strong> — yet the zone status shows <strong>heating</strong>.");
        ab("This could be:<br>1. <strong>Setpoint issue</strong> — someone changed the setpoint locally on the thermostat<br>2. <strong>Controller stuck</strong> — the valve/relay is stuck open regardless of the setpoint");
        aa([
            {label:'Try adjusting setpoint down to '+stuckZone.sp+'C remotely',fn:'_hsAdjust'},
            {label:'Setpoint is already correct — controller appears stuck',fn:'_hsStuck'},
        ]);
        render();
    },800);
},
_hsAdjust(){
    ag('Try adjusting setpoint');
    as('Sending setpoint command: set Bar to 18C...','sync');
    setTimeout(function(){
        as('Setpoint command sent','check_circle');
        arules('<strong>Rules Applied:</strong> Remote setpoint adjustment sent to override any local thermostat changes. If the setpoint was changed locally on the wall thermostat, this remote command will correct it. The heating should stop within 5-10 minutes if this was the issue.');
        ar('<strong>Setpoint reset to 18C.</strong> If the heating was running because of a local setpoint change, it should stop within 5-10 minutes.');
        actionsTaken.push('Reset Bar setpoint to 18C remotely (was showing heating at 22.5C)');
        summary.push('Adjusted setpoint: Bar zone reset to 18C — was heating at 22.5C');
        ab("Monitor for 5-10 minutes. If it doesn't stop, the controller may be stuck and needs IoT investigation.");
        aa([
            {label:'Resolved — heating is stopping',fn:'_hsResolved',cls:'ok'},
            {label:'Still heating — escalate as stuck controller',fn:'_hsStuck',cls:'err'},
        ]);
        render();
    },600);
},

// --- KITCHEN EQUIPMENT (FRYERS) ---
kitchenEquip(){
    as('Starting: <strong>Kitchen Equipment (Fryers)</strong>','play_arrow');as('Checking Tuya for device at '+sn()+'...','sync');
    setTimeout(function(){
        const online=true;
        as('Device: Fryer Bank Switch — '+(online?'Connected':'DISCONNECTED'),'check_circle');
        dataSnapshots.push({label:'Kitchen Equipment (Tuya)',headers:['Device','State','Connected'],rows:[['Fryer Bank Switch','OFF','Yes']]});
        if(!online){
            ab("<strong style='color:var(--err)'>Device is DISCONNECTED.</strong> We cannot control this remotely. This is a connectivity issue.");
            aft('Any additional details about the connectivity issue?','_kDisconnectedSubmit');
            render();return;
        }
        const h=new Date().getHours(),schedOn=SCHEDS.find(s=>s.act==='ON'&&s.on);
        const shouldBeOn=h>=parseInt(schedOn?.time);
        ab("The <strong>Fryer Bank Switch</strong> is currently <strong style='color:var(--err)'>OFF</strong>.\n\nSchedule says next ON: <strong>"+schedOn.time+" ("+schedOn.days+")</strong>.");
        if(shouldBeOn) ab("Based on the schedule, this equipment <strong>should be on now</strong>. It may have failed or been turned off manually.");
        else ab("Based on the schedule, this equipment is <strong>correctly off</strong> — not due on until "+schedOn.time+".");
        ab("Why does the caller need this switched on?");
        aa([
            {label:'Site opening earlier than usual — need the schedule brought forward for today',fn:'_kearly'},
            {label:'They need it on now and it should already be on (schedule should have fired)',fn:'_kshouldbeon'},
            {label:'It was on and turned off unexpectedly during service',fn:'_kunexpected'},
            {label:'Other reason',fn:'_kother'},
        ]);
        render();
    },800);
},

// === TRIAGE RENDERER ===
function renderTriage(c){
    document.getElementById('pT').textContent=FLOW_NAMES[flow]||'Triage';

    let ch=msgs.map(function(m,i){
        if(m.r==='acts') return '<div class="acts">'+m.a.map(function(a){return '<button class="ab '+(a.cls||'')+'" onclick="F[\''+a.fn+'\']()">'+a.label+'</button>'}).join('')+'</div>';
        if(m.r==='ft'){
            // Determine which submit function to call
            var submitFn=m.submitFn||'_seSubmit';
            return '<div class="detail-capture"><label>'+(m.prompt||'Provide details')+'</label><textarea id="ftInput" rows="3" placeholder="Type here..."></textarea><button class="ab ok" style="margin-top:4px" onclick="F[\''+submitFn+'\']()"><span class="material-icons-outlined">send</span> Submit</button></div>';
        }
        if(m.r==='fridge_detail') return '<div class="detail-capture"><label>Which equipment?</label><select id="frEquip"><option>Walk-in fridge</option><option>Walk-in freezer</option><option>Under-counter fridge</option><option>Under-counter freezer</option><option>Beer cellar cooler</option><option>Display fridge</option><option>Other</option></select><label>What\'s the impact?</label><select id="frImpact"><option>Alarm sounding but equipment still working</option><option>Temperature rising — food stock at risk</option><option>Equipment completely off — food stock at risk</option><option>Minor — no immediate food safety concern</option></select><label>Any other details?</label><textarea id="frDetails" rows="2" placeholder="e.g. current temperature reading, how long it\'s been happening..."></textarea><button class="ab ok" style="margin-top:4px" onclick="F._fridgeSubmit()"><span class="material-icons-outlined">send</span> Submit Details</button></div>';
        if(m.r==='error_detail') return '<div class="detail-capture"><label>Which equipment is showing the error?</label><select id="errEquip"><option>Heating thermostat</option><option>Boiler controller</option><option>Kitchen equipment display</option><option>Fridge/freezer display</option><option>AC controller</option><option>Other</option></select><label>Error code or message (if visible)</label><input type="text" id="errCode" placeholder="e.g. E04, ERR, flashing red"><label>Impact</label><select id="errImpact"><option>Equipment still working despite error</option><option>Equipment not working — affecting service</option><option>Cannot tell — display is the only issue</option></select><button class="ab ok" style="margin-top:4px" onclick="F._ctErrorSubmit()"><span class="material-icons-outlined">send</span> Submit Details</button></div>';
        if(m.r==='rules') return '<div class="msg msg-rules"><div class="mh"><span class="material-icons-outlined">auto_awesome</span> '+m.tm+'</div><div class="mt">'+m.t+'</div></div>';
        var cls={bot:'msg-bot',agent:'msg-agent',sys:'msg-sys',esc:'msg-esc',res:'msg-res',script:'msg-script'}[m.r]||'msg-bot';
        return '<div class="msg '+cls+'"><div class="mh"><span class="material-icons-outlined">'+m.i+'</span> '+m.tm+(m.sev?' <span class="sev '+m.sev+'">'+m.sev.toUpperCase()+'</span>':'')+'</div><div class="mt">'+m.t+'</div></div>';
    }).join('');

    c.innerHTML=`
    <div class="steps"><div class="step done"><span class="material-icons-outlined">check_circle</span> New Call</div><div class="step done"><span class="material-icons-outlined">check_circle</span> Caller Details</div><div class="step active"><span class="material-icons-outlined">chat</span> Triage</div><div class="step">Wrap Up</div></div>
    <div class="tl"><div class="tc">
        <div class="th"><button class="ab sec" onclick="goHome()"><span class="material-icons-outlined">close</span> Abort</button><div class="tfn"><span class="material-icons-outlined">${FLOW_ICONS[flow]||'chat'}</span>${FLOW_NAMES[flow]||'Triage'}</div><div style="width:80px"></div></div>
        <div class="ca" id="chat">${ch}</div>
    </div><div class="ts">${buildSB()}</div></div>`;
    var el=document.getElementById('chat');if(el)el.scrollTop=el.scrollHeight;
}

function buildSB(){
    let s='';
    // Heating zones sidebar
    if(flow==='tooCold'||flow==='tooHot'||flow==='heatingStuck'){
        s+='<div class="dc"><h4><span class="material-icons-outlined" style="font-size:16px">thermostat</span> Heating Zones</h4><table class="dt"><tr><th>Zone</th><th>Temp</th><th>Set</th><th>Status</th></tr>';
        ZONES.forEach(function(z){s+='<tr class="'+(z.temp<z.sp-2?'hl':'')+'"><td>'+z.zone+'</td><td><strong>'+z.temp+'C</strong></td><td>'+z.sp+'C</td><td><span class="sd '+(z.st==='heating'?'a':z.st==='idle'?'g':'r')+'"></span>'+z.st+'</td></tr>'});
        s+='</table></div>';
    }
    // Kitchen equipment sidebar
    if(flow==='kitchenEquip'||flow==='keepsTurningOff'){
        s+='<div class="dc"><h4><span class="material-icons-outlined" style="font-size:16px">power</span> Device</h4><table class="dt"><tr><th>Device</th><th>State</th><th>Connected</th></tr><tr><td>Fryer Bank Switch</td><td><strong style="color:var(--err)">OFF</strong></td><td><span class="sd g"></span>Yes</td></tr></table></div>';
        s+='<div class="dc"><h4><span class="material-icons-outlined" style="font-size:16px">schedule</span> Schedules</h4><table class="dt"><tr><th>Name</th><th>Time</th><th>Action</th><th>Days</th></tr>';
        SCHEDS.forEach(function(sc){s+='<tr><td>'+sc.name+'</td><td>'+sc.time+'</td><td>'+sc.act+'</td><td>'+sc.days+'</td></tr>'});s+='</table></div>';
    }
    // AC sidebar
    if(flow==='acColdWarm'||flow==='acWarmCool'||flow==='acWontOff'){
        s+='<div class="dc"><h4><span class="material-icons-outlined" style="font-size:16px">ac_unit</span> AC Units (Intesis)</h4><table class="dt"><tr><th>Unit</th><th>Power</th><th>Mode</th><th>Set</th><th>Room</th></tr>';
        INTESIS_UNITS.forEach(function(u){s+='<tr><td>'+u.name+'</td><td>'+(u.power==='On'?'<span class="sd g"></span>':'<span class="sd r"></span>')+u.power+'</td><td>'+u.mode+'</td><td>'+u.setpoint+'C</td><td>'+u.roomTemp+'C</td></tr>'});
        s+='</table></div>';
    }
    // Ovens/grills sidebar
    if(flow==='ovensGrills'){
        s+='<div class="dc"><h4><span class="material-icons-outlined" style="font-size:16px">restaurant</span> Oven/Grill Devices</h4><table class="dt"><tr><th>Device</th><th>Status</th><th>Last Seen</th></tr><tr><td>Main Oven</td><td><span class="sd g"></span>Online</td><td>2 min ago</td></tr><tr><td>Combi Oven</td><td><span class="sd r"></span>Offline</td><td>4 hrs ago</td></tr><tr><td>Char Grill</td><td><span class="sd g"></span>Online</td><td>3 min ago</td></tr></table></div>';
    }
    // Fridge sidebar
    if(flow==='fridgeIssue'||flow==='wontTurnOnFridge'){
        s+='<div class="dc"><h4><span class="material-icons-outlined" style="font-size:16px">kitchen</span> Refrigeration</h4><table class="dt"><tr><th>Sensor</th><th>Temp</th><th>Limit</th><th>Status</th></tr>';
        s+='<tr><td>Walk-in Fridge</td><td>3.2C</td><td>5C</td><td><span class="sd g"></span>OK</td></tr>';
        s+='<tr><td>Walk-in Freezer</td><td>-18.5C</td><td>-15C</td><td><span class="sd g"></span>OK</td></tr>';
        s+='<tr><td>Beer Cellar</td><td>11.8C</td><td>12C</td><td><span class="sd g"></span>OK</td></tr>';
        s+='<tr class="hl"><td>U/C Fridge 1</td><td>6.8C</td><td>5C</td><td><span class="sd r"></span>ALARM</td></tr>';
        s+='</table></div>';
    }
    // Active override
    if(actionsTaken.some(function(x){return x.includes('Boosted')||x.includes('Switched')||x.includes('Reset')})){
        s+='<div class="pc"><h4><span class="material-icons-outlined" style="font-size:14px">timer</span> Active Override</h4><div style="font-size:18px;font-weight:700;color:#92400e">1h 58m</div><div style="font-size:12px;margin-top:4px">Auto-reverts '+rv()+'</div></div>';
    }
    // Call details
    s+='<div class="cc"><h4>Call Details</h4>';
    if(caller.name)s+='<div class="cr"><span>Caller</span><span>'+esc(caller.name)+'</span></div>';
    if(caller.role)s+='<div class="cr"><span>Role</span><span>'+caller.role+'</span></div>';
    if(caller.phone)s+='<div class="cr"><span>Phone</span><span>'+caller.phone+'</span></div>';
    if(caller.email)s+='<div class="cr"><span>Email</span><span>'+caller.email+'</span></div>';
    if(site){s+='<div class="cr"><span>Site</span><span>'+sn()+'</span></div>';s+='<div class="cr"><span>Site #</span><span>'+site.no+'</span></div>';s+='<div class="cr"><span>Client</span><span>'+site.client+'</span></div>';s+='<div class="cr"><span>Hours</span><span>'+site.hours+'</span></div>'}
    s+='</div>';return s;
}

// === WRAP UP ===
function renderWrapUp(c){
    document.getElementById('pT').textContent='Wrap Up';
    const dur=fs?Math.round((new Date()-fs)/60000):0;

    // Build comprehensive triage summary
    var sumText='=== OOH Triage Summary ===\n';
    sumText+='Flow: '+(FLOW_NAMES[flow]||flow)+'\n';
    sumText+='Site: '+sn()+' ('+(site?.no||'N/A')+') — '+(site?.client||'')+'\n';
    sumText+='Caller: '+(caller.name||'N/A')+' ('+(caller.role||'N/A')+') — '+(caller.phone||'N/A')+(caller.email?' — '+caller.email:'')+'\n';
    sumText+='Duration: '+dur+' min\n';
    if(caller.desc) sumText+='Description: '+caller.desc+'\n';
    sumText+='\n';

    // Agent selections
    var agentMsgs=msgs.filter(function(m){return m.r==='agent'});
    if(agentMsgs.length){
        sumText+='--- Agent Selections ---\n';
        agentMsgs.forEach(function(m){sumText+='['+m.tm+'] '+m.t.replace(/<[^>]*>/g,'')+'\n'});
        sumText+='\n';
    }

    // Data snapshots
    if(dataSnapshots.length){
        sumText+='--- Data Snapshots ---\n';
        dataSnapshots.forEach(function(snap){
            sumText+=snap.label+':\n';
            sumText+='  '+snap.headers.join(' | ')+'\n';
            snap.rows.forEach(function(row){sumText+='  '+row.join(' | ')+'\n'});
            sumText+='\n';
        });
    }

    // Actions taken
    if(actionsTaken.length){
        sumText+='--- Actions Taken ---\n';
        actionsTaken.forEach(function(a){sumText+='- '+a+'\n'});
        sumText+='\n';
    }

    // Escalation
    if(escalationData){
        sumText+='--- Escalation ---\n';
        sumText+='Issue: '+escalationData.issue+'\n';
        sumText+='Severity: '+escalationData.severity.toUpperCase()+'\n';
        sumText+='Destination: '+escalationData.destination+'\n';
        sumText+='Timeframe: '+escalationData.timeframe+'\n';
        sumText+='\n';
    }

    // Agent notes
    if(agentNotes){
        sumText+='--- Agent Notes ---\n';
        sumText+=agentNotes+'\n';
        sumText+='\n';
    }

    // Summary actions
    if(summary.length){
        sumText+='--- Summary ---\n';
        summary.forEach(function(s){sumText+=s+'\n'});
    }

    c.innerHTML=`
    <div class="steps"><div class="step done"><span class="material-icons-outlined">check_circle</span> New Call</div><div class="step done"><span class="material-icons-outlined">check_circle</span> Caller Details</div><div class="step done"><span class="material-icons-outlined">check_circle</span> Triage</div><div class="step active"><span class="material-icons-outlined">task_alt</span> Wrap Up</div></div>
    <div class="form-section" style="border-left:3px solid var(--ok)">
        <h3><span class="material-icons-outlined">record_voice_over</span> Closing Script</h3>
        <div style="background:rgba(139,92,246,.06);border:1px solid rgba(139,92,246,.15);border-radius:var(--rs);padding:14px;font-size:13px;line-height:1.6;font-style:italic">
            "Is there anything else you called about today?"<br><br>
            <em style="font-style:normal;color:var(--txt2)">[If yes -> click 'Another issue' below]</em><br><br>
            "Thank you for calling, ${esc(caller.name)}. ${summary.some(function(s){return s.includes('Escalated')})?'As I mentioned, the IoT team will be in touch. ':''}Have a good ${new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening'}."
        </div>
    </div>
    <div class="form-section">
        <h3><span class="material-icons-outlined">summarize</span> Triage Summary</h3>
        <div style="background:var(--bg);border:1px solid var(--bdr);border-radius:var(--rs);padding:14px;font-family:monospace;font-size:11px;line-height:1.6;white-space:pre-wrap">${esc(sumText)}</div>
    </div>
    <div style="display:flex;gap:8px">
        <button class="ab ok" onclick="toast('Summary posted to Zendesk','check_circle')"><span class="material-icons-outlined">note_add</span> Post to Zendesk & Close</button>
        <button class="ab" onclick="newIssue()"><span class="material-icons-outlined">add_call</span> Caller has another issue</button>
    </div>`;
}
