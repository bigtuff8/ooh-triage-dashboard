name: CI

# Until 2026-09-24 this repo had NO automated checks and `main` was unprotected, so every
# safety property the design relies on — the OOHDASH-19 Stream A write-flip interlock, the
# OOHDASH-12 fail-closed WRITES_DISABLED contract, the refrigeration switch-deny — was only
# ever enforced by someone remembering to run `npm run test:unit` by hand. This workflow makes
# them enforced.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  unit:
    # REQUIRED CHECK. This is the gate: it carries test/interlock-stream-a.test.js, which refuses
    # a WRITES_DISABLED=false manifest unless a Stream A observed-live sign-off backs it.
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # `npm run test:unit` passes --experimental-test-module-mocks, which needs Node >= 22.3.
          # Pinned to 24 to match the development environment.
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run test:unit

  e2e:
    # NOT a required check yet — see below. Reports honestly so the failures stay visible
    # rather than being hidden behind continue-on-error.
    #
    # As of 2026-09-24 two specs fail on a clean main and have done for some time:
    #   tests/control.spec.js:229          outcome-record failure / 500 path
    #   tests/tonight-callback.spec.js:136 P1 contractor "text message" wording
    # Both reproduce on an untouched origin/main checkout, so they are pre-existing, not a
    # regression. Once they are fixed, add "e2e" to the required status checks on main.
    name: e2e (playwright, not yet required)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # The suite runs the real server itself in fixture mode (playwright.config.js webServer),
      # so no external services, secrets or network access are needed — only a browser.
      - run: npx playwright install --with-deps chromium

      - run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
