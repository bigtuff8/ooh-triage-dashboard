name: CI

# Until 2026-09-24 this repo had NO automated checks and `main` was unprotected, so every
# safety property the design relies on — the OOHDASH-19 Stream A write-flip interlock, the
# OOHDASH-12 fail-closed WRITES_DISABLED contract, the refrigeration switch-deny — was only
# ever enforced by someone remembering to run `npm run test:unit` by hand. This workflow makes
# them enforced.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  unit:
    # REQUIRED CHECK. This is the gate: it carries test/interlock-stream-a.test.js, which refuses
    # a WRITES_DISABLED=false manifest unless a Stream A observed-live sign-off backs it.
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # `npm run test:unit` passes --experimental-test-module-mocks, which needs Node >= 22.3.
          # Pinned to 24 to match the development environment.
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run test:unit

  e2e:
    # REQUIRED CHECK (OOHDASH-109, 2026-10-06). The browser suite is the only end-to-end safety
    # net over the confirm-gate → triage-flow → control/escalate chain.
    #
    # It had rotted while non-required: OOHDASH-89/91 removed the `device-board` test id (device
    # state is now triage-question-led), which broke the shared confirmSite helper and took 30 of
    # the specs down at the confirm step — invisible because e2e was not gating. The older
    # 2026-09-24 pair (control.spec.js:229 500-path, tonight-callback.spec.js:136 P1 wording) were
    # the same class of stale-harness drift against the OOHDASH-72 log-mode honesty copy. All fixed
    # in OOHDASH-109; the suite is green on a clean main, so e2e now gates like the unit check.
    name: e2e (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # The suite runs the real server itself in fixture mode (playwright.config.js webServer),
      # so no external services, secrets or network access are needed — only a browser.
      - run: npx playwright install --with-deps chromium

      - run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
